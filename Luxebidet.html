
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebAR Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body {
    margin: 0;
    background: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
      h1 { font-family: sans-serif; }
      model-viewer { width: 100%; height: 500px; }
    </style>
  </head>

  <body>
	 <br>
	 <br>
    
    <h1>
    🚀LUXEBIDET AR Model Viewer</h1>

   <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
  #controls {
    margin: 10px;
    text-align: center;
  }
  button {
    margin: 5px;
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #4CAF50;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background: #45a049;
  }
</style>

<div id="controls">
  <button onclick="setAutoRotate(true)">Auto Rotate</button>
  <button onclick="setAutoRotate(false)">Stop Rotate</button>
  <button onclick="enableCameraControls()">Manual Rotate</button>
  <button onclick="disableCameraControls()">Lock View</button>
</div>

<model-viewer 
  id="modelViewer"
  src="https://chomromsin.github.io/armodel/Luxebidet.glb"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls 
  auto-rotate
  exposure="0.8"
  shadow-intensity="1"
  style="background: white; width: 100%; height: 800px;">
</model-viewer>

<script>
  const viewer = document.getElementById('modelViewer');

  function setAutoRotate(enable) {
    viewer.autoRotate = enable;
  }

  function enableCameraControls() {
    viewer.cameraControls = true;
  }

  function disableCameraControls() {
    viewer.cameraControls = false;
  }
</script>

<BR><BR>
	
	<h1>&nbsp;</h1>
  </body>
</html>
